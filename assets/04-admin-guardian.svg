<rect x="490" y="525" width="270" height="68" rx="16" fill="#f5e8cf"/><text x="510" y="552" font-family="Arial,sans-serif" font-size="13" fill="#4e443a">Thank you for your interest in Echoes —</text><text x="510" y="574" font-family="Arial,sans-serif" font-size="13" fill="#4e443a">it's still available.</text>
